apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service-deployment
  namespace: nexcart

spec:
  revisionHistoryLimit: 0
  replicas: 5

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: shresth2725/auth-service:54

          envFrom:
            - secretRef:
                name: auth-secret

          ports:
            - containerPort: 3001
