apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: nexcart

spec:
  replicas: 5

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: shresth2725/frontend:45

          ports:
            - containerPort: 80

          envFrom:
            - secretRef:
                name: frontend-secret
