apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: nexcart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: shresth2725/frontend:latest

          ports:
            - containerPort: 80
