apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-deployment
  namespace: nexcart

spec:
  revisionHistoryLimit: 0
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: shresth2725/api-gateway:52

          ports:
            - containerPort: 80
