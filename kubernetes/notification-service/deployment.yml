apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service-deployment
  namespace: nexcart

spec:
  revisionHistoryLimit: 0
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: shresth2725/notification-service:50

          envFrom:
            - secretRef:
                name: notification-secret

          ports:
            - containerPort: 3002
