apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service-deployment
  namespace: nexcart

spec:
  revisionHistoryLimit: 0
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: shresth2725/order-service:50

          envFrom:
            - secretRef:
                name: order-secret

          ports:
            - containerPort: 3005
