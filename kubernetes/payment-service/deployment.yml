apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service-deployment
  namespace: nexcart

spec:
  revisionHistoryLimit: 0
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: shresth2725/payment-service:55

          envFrom:
            - secretRef:
                name: payment-secret

          ports:
            - containerPort: 3006
