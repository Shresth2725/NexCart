apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service-deployment
  namespace: nexcart

spec:
  revisionHistoryLimit: 0
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: shresth2725/products-service:54

          envFrom:
            - secretRef:
                name: product-secret

          ports:
            - containerPort: 3003
